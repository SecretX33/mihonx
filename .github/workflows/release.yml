name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to use (e.g. v1.2.3, leave empty for auto-bump)'
        required: false
        type: string
      commitHash:
        description: 'Commit hash to tag and release (leave empty to release the latest commit on main)'
        required: false
        type: string

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && (github.repository == 'mihonapp/mihon' || github.repository == 'SecretX33/mihonx')
    name: Prepare tag
    runs-on: 'ubuntu-24.04'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}

    steps:
      - name: Validate branch
        run: |
          set -e
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::Release workflow can only be triggered from the 'main' branch (current: '${{ github.ref_name }}')."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commitHash || 'main' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag and commit
        id: resolve
        run: |
          set -e

          COMMIT=$(git rev-parse HEAD)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

          INPUT_TAG="${{ inputs.tag }}"

          if [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            # Get the latest MihonX tag from the main lineage, then bump its patch version
            LATEST_TAG=$(git describe --tags --match 'v*' --abbrev=0 --first-parent 2>/dev/null || true)
            if [[ -z "$LATEST_TAG" ]]; then
              TAG="v0.0.1"
            else
              # Strip leading 'v', split by '.', bump patch
              VERSION="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG for commit: $COMMIT"

      - name: Create and push tag
        run: |
          set -e

          TAG="${{ steps.resolve.outputs.tag }}"
          COMMIT="${{ steps.resolve.outputs.commit }}"

          # Check if tag already exists on this commit
          EXISTING_TAG_COMMIT=$(git rev-list -n 1 "refs/tags/$TAG" 2>/dev/null || true)
          if [[ "$EXISTING_TAG_COMMIT" == "$COMMIT" ]]; then
            echo "Tag $TAG already exists on commit $COMMIT, skipping."
            exit 0
          elif [[ -n "$EXISTING_TAG_COMMIT" ]]; then
            echo "::error::Tag $TAG already exists but points to a different commit ($EXISTING_TAG_COMMIT instead of $COMMIT)."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$COMMIT"
          git push origin "$TAG"

  get_tag:
    name: Extract tag name
    runs-on: 'ubuntu-24.04'
    needs: [prepare]
    # Allow this job to run even when 'prepare' is skipped (tag push event)
    if: |
      always() &&
      (github.repository == 'mihonapp/mihon' || github.repository == 'SecretX33/mihonx') &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ needs.prepare.outputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build
    runs-on: 'ubuntu-24.04'
    needs: get_tag
    if: |
      always() &&
      (github.repository == 'mihonapp/mihon' || github.repository == 'SecretX33/mihonx') &&
      needs.get_tag.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.get_tag.outputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set version from tag
        run: |
          TAG="${{ needs.get_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "Derived version: $VERSION"
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts

      - name: Build
        run: ./gradlew assembleRelease -Pinclude-telemetry -Penable-updater
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk mihonx-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk mihonx-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk mihonx-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release.apk mihonx-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk mihonx-x86_64-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mihonx
          path: |
            mihonx-${{ needs.get_tag.outputs.tag }}.apk
            mihonx-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            mihonx-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            mihonx-x86-${{ needs.get_tag.outputs.tag }}.apk
            mihonx-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  build_foss:
    name: Build (FOSS)
    runs-on: ubuntu-24.04
    needs: get_tag
    if: |
      always() &&
      (github.repository == 'mihonapp/mihon' || github.repository == 'SecretX33/mihonx') &&
      needs.get_tag.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.get_tag.outputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Set version from tag
        run: |
          TAG="${{ needs.get_tag.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "Derived version: $VERSION"
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts

      - name: Build
        run: ./gradlew assembleFoss -Penable-updater
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/foss/app-universal-foss.apk mihonx-${{ needs.get_tag.outputs.tag }}-foss.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mihonx-foss
          path: mihonx-${{ needs.get_tag.outputs.tag }}-foss.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [get_tag, build, build_foss]
    if: |
      always() &&
      (github.repository == 'mihonapp/mihon' || github.repository == 'SecretX33/mihonx') &&
      needs.get_tag.result == 'success' &&
      needs.build.result == 'success' &&
      needs.build_foss.result == 'success'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: |
            mihonx
            mihonx-foss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: MihonX ${{ needs.get_tag.outputs.tag }}
          body: |
            Consider supporting the development on [Patreon](https://www.patreon.com/mihon/membership) or [OpenCollective](https://opencollective.com/mihon/contribute) to keep Mihon improving!

            Check out the [past release notes](https://github.com/mihonapp/mihon/releases) if you're upgrading from an earlier version.

            <!-->



            <!-->

            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `mihonx-${{ needs.get_tag.outputs.tag }}.apk`
          files: |
            mihonx-${{ needs.get_tag.outputs.tag }}.apk
            mihonx-${{ needs.get_tag.outputs.tag }}-foss.apk
            mihonx-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            mihonx-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            mihonx-x86-${{ needs.get_tag.outputs.tag }}.apk
            mihonx-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: false
          prerelease: false
          token: ${{ secrets.MIHON_BOT_TOKEN }}
